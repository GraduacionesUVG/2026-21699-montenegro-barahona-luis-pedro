schema_version: 1
experiment_track: blackbox_memory_poisoning

dataset:
  name: personamem_v2
  revision: ed956dea41521fc4499acbc63f966e0fd3c053ba
  subset: blackbox_battery_v1

condition:
  mechanism: langmem
  mechanism_version: 0.0.30
  write_policy: native_selective
  mechanism_options:
    writer_implementation: langmem_store_manager_v1
    writer_version: 0.0.30
    memory_types: [semantic]
    procedural_prompt_optimization: false
    storage_backend: sqlite
    enable_deletes: false
    query_limit: 5
    max_steps: 10
    temperature: 0
    seed: 42

models:
  # Digests are resolved from the endpoint before an executable run is accepted.
  writer: {provider: ollama, model: "qwen2.5:7b"}
  responder:
    provider: ollama
    model: "qwen2.5:7b"
    tokenizer:
      implementation: huggingface_auto
      model_id: Qwen/Qwen2.5-7B-Instruct
      revision: a09a35458c702b33eeacc393d103063234e8bc28
      transformers_version: 4.57.6
      use_fast: true
  embedding:
    provider: ollama
    model: "nomic-embed-text:137m-v1.5-fp16"
    dimensions: 768

retrieval:
  top_k: 5
  threshold: null
  context_token_budget: 2048

attack:
  knowledge: black_box
  delivery: conversation
  battery: pmv2_blackbox_battery_v1
  attack_id: bb-pi-001

isolation:
  run_id: langmem-example-do-not-execute
  config_ref: planning/config.md

replication:
  seed: 20260831
  response_replicates: 1
